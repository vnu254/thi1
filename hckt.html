      "Phạt tiền từ 6.000.000 đồng đến 8.000.000 đồng.",
      "Phạt tiền từ 5.000.000 đồng đến 7.0.000.000 đồng."
    ]
  }
];
const key = "trac-nghiem-hckt-2026-v1";
const questions = bank;
let mode = "exam";
let answers = {}, current = 0, submitted = false, missingNotice = false;
try {
  if (localStorage.getItem(key + "-mode") === "practice") mode = "practice";
} catch {}
function loadProgress() {
  answers = {};
  current = 0;
  submitted = false;
  missingNotice = false;
  try {
    const saved = JSON.parse(localStorage.getItem(mode === "exam" ? key : key + "-practice"));
    if (saved) ({answers, current, submitted} = saved);
  } catch {}
}
function save() {
  try {
    localStorage.setItem(mode === "exam" ? key : key + "-practice", JSON.stringify({answers, current, submitted}));
  } catch {}
}
function selectMode(nextMode) {
  if (mode === nextMode) return;
  mode = nextMode;
  try {
    localStorage.setItem(key + "-mode", mode);
  } catch {}
  loadProgress();
  render();
}
function render(focus = false) {
  const item = questions[current];
  const practice = mode === "practice";
  const selected = answers[current];
  const reveal = submitted || (practice && selected !== undefined);
  const answered = Object.keys(answers).length;
  const graded = questions.filter(question => question.correct !== null).length;
  const correct = questions.filter((question, index) => answers[index] === question.correct).length;
  $("bank").textContent = questions.length + " câu hỏi";
  $("practiceMode").setAttribute("aria-pressed", String(practice));
  $("examMode").setAttribute("aria-pressed", String(!practice));
  $("modeHint").textContent = practice
    ? "Xem đáp án ngay sau mỗi lần chọn."
    : "Bạn có thể đổi lựa chọn trước khi nộp. Đáp án hiện sau khi nộp bài.";
  $("progressText").textContent = "Đã trả lời " + answered + "/" + questions.length + " câu";
  $("progress").max = questions.length;
  $("progress").value = answered;
  $("jump").replaceChildren(...questions.map((question, index) =>
    new Option((index + 1) + (answers[index] === undefined ? "" : " ✓"), index, false, index === current)));
  $("prompt").textContent = "Câu " + item.id + ". " + item.prompt;
  $("options").replaceChildren(...item.options.map((choice, index) => {
    const label = document.createElement("label");
    label.className = "option";
    const radio = document.createElement("input");
    radio.type = "radio";
    radio.name = "answer";
    radio.checked = answers[current] === index;
    radio.disabled = reveal;
    radio.addEventListener("change", () => {
      answers[current] = index;
      save();
      render();
      if (practice) $("feedback").focus();
      else $("options").querySelector("input:checked")?.focus();
    });
    const text = document.createElement("span");
    text.textContent = String.fromCharCode(65 + index) + ". " + choice;
    label.append(radio, text);
    if (reveal && item.correct !== null && (item.correct === index || radio.checked)) {
      const mark = document.createElement("span");
      mark.className = "mark";
      mark.textContent = item.correct === index ? "Đáp án đúng" : "Bạn chọn";
      label.classList.add(item.correct === index ? "correct" : "wrong");
      label.append(mark);
    }
    return label;
  }));
  $("previous").disabled = current === 0;
  $("next").disabled = current === questions.length - 1;
  $("submit").disabled = submitted;
  $("submit").textContent = practice ? "Xem tổng điểm" : "Nộp bài";
  $("feedback").textContent = reveal
    ? item.correct === null
      ? "Câu này chưa có đáp án trong đề gốc."
      : practice && selected !== undefined
        ? (selected === item.correct ? "Bạn trả lời đúng." : "Bạn trả lời sai. Đáp án đúng là " + String.fromCharCode(65 + item.correct) + ".")
        : ""
    : "";
  $("result").textContent = submitted
    ? "Kết quả · " + correct + "/" + graded + " câu đúng · " +
      (correct * 10 / graded).toLocaleString("vi-VN", {maximumFractionDigits:2}) + "/10. " +
      (questions.length - graded) + " câu chưa có đáp án trong đề gốc." +
      (item.correct === null ? " Câu " + item.id + " không tính điểm." : "")
    : missingNotice ? "Bạn còn " + (questions.length - answered) + " câu chưa trả lời." : "";
  if (focus) $("prompt").focus();
}
function move(index) {
  current = index;
  save();
  render(true);
}
function canReplace() {
  return !Object.keys(answers).length && !submitted || confirm("Thao tác này sẽ xóa bài làm hiện tại. Bạn có muốn tiếp tục?");
}
$("practiceMode").onclick = () => selectMode("practice");
$("examMode").onclick = () => selectMode("exam");
$("previous").onclick = () => move(current - 1);
$("next").onclick = () => move(current + 1);
$("jump").onchange = event => move(Number(event.target.value));
$("submit").onclick = () => {
  const remaining = questions.length - Object.keys(answers).length;
  if (remaining && !confirm("Còn " + remaining + " câu chưa trả lời. Bạn vẫn muốn kết thúc bài làm?")) {
    missingNotice = true;
    move(questions.findIndex((_, index) => answers[index] === undefined));
    return;
  }
  missingNotice = false;
  submitted = true;
  save();
  render();
};
$("reset").onclick = () => {
  if (!canReplace()) return;
  answers = {};
  submitted = false;
  missingNotice = false;
  move(0);
};
loadProgress();
render();
</script>
</html>
